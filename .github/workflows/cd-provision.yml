# =============================================================================
# CD - Provision Infra
# =============================================================================
# Provisiona AWS via Terraform e configura kubernets + ingress-nginx + namespaces
# na EC2 via Ansible.
#
# Fluxo:
#   1. Autentica na AWS
#   2. Baixa o state anterior (se existir)
#   3. Gera chave SSH nova e importa a pública na AWS
#   4. Terraform plan + apply
#   5. Salva o state como artifact (sempre)
#   6. Falha o job se o apply falhou
#   7. Aguarda SSH, roda Ansible (inventário inline)
#   8. Publica chave privada como artifact ec2-ssh-key (1 dia)
#
# Uso: Actions → CD - Provision Infra → Run workflow
#
# Nota sobre actions: usamos tags mutáveis (@v4, @v3) em vez de pin por SHA
# para evitar quebra por SHA errado. Em produção real, prefira pin por SHA
# com auditoria.
# =============================================================================
name: CD - Provision Infra

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: provision-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provision:
    name: Provision EC2 + kubernets + ingress-nginx
    runs-on: ubuntu-latest
    environment: aws
    outputs:
      public_ip: ${{ steps.tf.outputs.public_ip }}
      instance_id: ${{ steps.tf.outputs.instance_id }}
      app_url: ${{ steps.tf.outputs.app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Autenticação AWS via secrets do Environment aws.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      # Baixa o state salvo por execução anterior (se existir).
      - name: Baixar state do Terraform
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: terraform/
        continue-on-error: true

      # Gera o par de chaves no próprio runner.
      - name: Gerar par de chaves SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/deploy_key -C "github-actions"
          chmod 600 ~/.ssh/deploy_key
          echo "Chave gerada"

      # Registra a pública na AWS como Key Pair.
      - name: Importar chave pública na AWS
        run: |
          aws ec2 delete-key-pair --key-name ci-cd-deploy-key 2>/dev/null || true
          aws ec2 import-key-pair \
            --key-name ci-cd-deploy-key \
            --public-key-material fileb://$HOME/.ssh/deploy_key.pub

      # Inicializa o diretório do Terraform.
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      # Plan: mostra o que vai ser feito antes de aplicar.
      # TF_VAR_root_volume_size é obrigatório por causa da validation no variables.tf.
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_aws_region:        ${{ vars.AWS_REGION }}
          TF_VAR_instance_type:     ${{ vars.TF_INSTANCE_TYPE }}
          TF_VAR_key_name:          ci-cd-deploy-key
          TF_VAR_root_volume_size:  30
        run: terraform plan -input=false -out=tfplan

      # Apply. continue-on-error permite capturar o state mesmo em falha.
      - name: Terraform apply
        id: tf
        continue-on-error: true
        working-directory: terraform
        env:
          TF_VAR_aws_region:        ${{ vars.AWS_REGION }}
          TF_VAR_instance_type:     ${{ vars.TF_INSTANCE_TYPE }}
          TF_VAR_key_name:          ci-cd-deploy-key
          TF_VAR_root_volume_size:  30
        run: |
          terraform apply -input=false -auto-approve tfplan
          echo "public_ip=$(terraform output -raw instance_public_ip 2>/dev/null || echo 'n/a')" >> $GITHUB_OUTPUT
          echo "instance_id=$(terraform output -raw instance_id 2>/dev/null || echo 'n/a')"       >> $GITHUB_OUTPUT
          echo "app_url=$(terraform output -raw application_url 2>/dev/null || echo 'n/a')"       >> $GITHUB_OUTPUT

      # Salva o state MESMO se o apply falhou.
      - name: Salvar state do Terraform (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate
          if-no-files-found: ignore
          retention-days: 7

      # Se o apply falhou, para aqui.
      - name: Falhar se o apply falhou
        if: steps.tf.outcome == 'failure'
        run: |
          echo "Terraform apply falhou. Abortando o restante do pipeline." >&2
          exit 1

      - name: Instalar Ansible
        run: pip install "ansible-core>=2.15"

      # Aguarda o SSH da EC2.
      - name: Aguardar SSH da EC2
        run: |
          for i in $(seq 1 40); do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                 -o ConnectTimeout=5 \
                 ec2-user@${{ steps.tf.outputs.public_ip }} true 2>/dev/null; then
              echo "SSH ok"
              exit 0
            fi
            echo "aguardando... ($i/40)"
            sleep 10
          done
          echo "Timeout aguardando SSH" >&2
          exit 1

      # Ansible configura a EC2.
      # -i "${EC2_IP}," (vírgula no final) = inventário inline, host único.
      # Evita o inventory.sh que não funciona no runner por falta de bit +x.
      - name: Ansible provision
        working-directory: ansible
        env:
          EC2_IP: ${{ steps.tf.outputs.public_ip }}
        run: |
          ansible-playbook -i "${EC2_IP}," playbook.yml

      # Publica a chave privada como artifact temporário.
      - name: Upload chave SSH como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2-ssh-key
          path: ~/.ssh/deploy_key
          retention-days: 1

      - name: Resumo
        run: |
          {
            echo "### Infra provisionada"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| IP público | \`${{ steps.tf.outputs.public_ip }}\` |"
            echo "| Instance ID | \`${{ steps.tf.outputs.instance_id }}\` |"
            echo "| URL | ${{ steps.tf.outputs.app_url }} |"
            echo ""
            echo "### Próximos passos"
            echo "1. Baixe o artifact \`ec2-ssh-key\`"
            echo "2. Cadastre em Environment \`aws\` como secret \`EC2_SSH_KEY\`"
            echo "3. Atualize a variable \`EC2_PUBLIC_IP\` com o IP acima"
          } >> $GITHUB_STEP_SUMMARY
