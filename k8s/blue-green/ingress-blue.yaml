# =============================================================================
# ingress-blue.yaml — Ingress dedicado ao slot BLUE
# =============================================================================
# Host: app-go-azul.local
# Backend: Service app-go-blue (ClusterIP do slot blue).
# IngressClass: traefik (padrão do K3s).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go-blue-temp
  namespace: blue-green
spec:
  ingressClassName: traefik
  rules:
    - host: app-go-azul.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-blue
                port:
                  number: 5000
