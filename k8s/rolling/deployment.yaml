# =============================================================================
# KUBERNETES - ROLLING UPDATE
# =============================================================================
# Deployment da aplicação Go no namespace rolling; a imagem é preenchida pelo CD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-go
  namespace: rolling
  labels:
    app: app-go
    deployment: rolling

# Configuração do RollingUpdate.
spec:
  replicas: 2

  # Mantém disponibilidade durante a atualização.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Seleciona os Pods pertencentes ao Deployment.
  selector:
    matchLabels:
      app: app-go

  # Configuração dos Pods criados pelo Deployment.
  template:
    metadata:
      labels:
        app: app-go

    spec:
      # ServiceAccount usada pela aplicação.
      serviceAccountName: app-go-sa

      # Permite baixar a imagem privada do GHCR.
      imagePullSecrets:
        - name: ghcr-secret

      # Tempo para encerramento controlado do Pod.
      terminationGracePeriodSeconds: 30

      containers:
        - name: app

          # Substituído pelo GitHub Actions durante o deploy.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          # Porta HTTP da aplicação Go.
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          # Variáveis utilizadas pela aplicação.
          env:
            - name: APP_NAME
              value: "APP-GO Rolling"

            - name: APP_COLOR
              value: "purple"

            - name: APP_PORT
              value: "5000"

            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_USER
              value: "appuser"

            # Senha carregada do Secret do PostgreSQL.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              value: "appdb"

          # Verifica quando o Pod pode receber tráfego.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
            successThreshold: 1

          # Reinicia o container se a aplicação deixar de responder.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          # Limites de CPU e memória do container.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Aguarda antes de encerrar o processo durante o rollout.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 5"
