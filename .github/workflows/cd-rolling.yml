# =============================================================================
# CD - Rolling Update
# =============================================================================
#
# Fluxo:
#
#   GitHub Actions
#        |
#        v
#   Build da aplicação
#        |
#        v
#   Push GHCR
#        |
#        v
#   SSH EC2
#        |
#        v
#   K3s
#        |
#        v
#   PostgreSQL
#        |
#        v
#   Deployment Rolling
#        |
#        v
#   Service
#        |
#        v
#   Ingress
#        |
#        v
#   rolling.local
#
# =============================================================================

name: CD - Rolling Update

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem (latest = SHA do commit)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: rolling-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

  EC2_USER: ec2-user
  EC2_HOST: ${{ vars.EC2_PUBLIC_IP }}

  NAMESPACE: rolling
  APP_NAME: app-go

  ROLLING_HOST: rolling.local

  KUBECTL: sudo /usr/local/bin/kubectl


# =============================================================================
# BUILD
# =============================================================================

jobs:

  build-and-push:

    name: Build & Push

    runs-on: ubuntu-latest

    environment: aws

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Go
      # -----------------------------------------------------------------------

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false


      # -----------------------------------------------------------------------
      # Validar aplicação
      # -----------------------------------------------------------------------

      - name: Validar aplicação
        shell: bash
        run: |
          set -euo pipefail

          echo "Validando arquivos..."

          test -f go.mod
          test -f go.sum
          test -f Dockerfile
          test -f src/main.go

          echo "Arquivos da aplicação encontrados."


      # -----------------------------------------------------------------------
      # Dependências Go
      # -----------------------------------------------------------------------

      - name: Verificar dependências Go
        run: |
          set -euo pipefail

          go mod download

          go mod verify


      # -----------------------------------------------------------------------
      # Testes
      # -----------------------------------------------------------------------

      - name: Testes
        run: |
          set -euo pipefail

          go test ./...


      # -----------------------------------------------------------------------
      # Build local
      # -----------------------------------------------------------------------

      - name: Build Go
        run: |
          set -euo pipefail

          go build -o /tmp/app-go ./src


      # -----------------------------------------------------------------------
      # Buildx
      # -----------------------------------------------------------------------

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3


      # -----------------------------------------------------------------------
      # Login GHCR
      # -----------------------------------------------------------------------

      - name: Login GHCR
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------------------------------------
      # Build + Push
      # -----------------------------------------------------------------------

      - name: Build & Push
        uses: docker/build-push-action@v6

        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}

      # -----------------------------------------------------------------------
      # Resumo
      # -----------------------------------------------------------------------

      - name: Resumo do build
        run: |
          {
            echo "### Build concluído"
            echo ""
            echo "- Imagem: \`${IMAGE_NAME}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"


# =============================================================================
# DEPLOY
# =============================================================================

  deploy:

    name: Rolling Deploy

    needs: build-and-push

    runs-on: ubuntu-latest

    environment: aws

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Validar variáveis
      # -----------------------------------------------------------------------

      - name: Validar configuração
        shell: bash
        run: |
          set -euo pipefail

          test -n "${EC2_HOST}"

          echo "EC2_HOST=${EC2_HOST}"
          echo "EC2_USER=${EC2_USER}"
          echo "NAMESPACE=${NAMESPACE}"
          echo "APP_NAME=${APP_NAME}"
          echo "ROLLING_HOST=${ROLLING_HOST}"
          echo "IMAGE_NAME=${IMAGE_NAME}"


      # -----------------------------------------------------------------------
      # SSH
      # -----------------------------------------------------------------------

      - name: Configurar chave SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keygen \
            -y \
            -f ~/.ssh/deploy_key \
            > /dev/null

          echo "Chave SSH válida."


      # -----------------------------------------------------------------------
      # Testar SSH
      # -----------------------------------------------------------------------

      - name: Testar SSH
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${EC2_USER}@${EC2_HOST}" \
            'echo "SSH OK"'


      # -----------------------------------------------------------------------
      # Renderizar Deployment
      # -----------------------------------------------------------------------

      - name: Renderizar Deployment
        shell: bash
        run: |
          set -euo pipefail

          FILE="k8s/rolling/deployment.yaml"

          test -f "$FILE"

          echo "==============================================="
          echo "VALIDANDO DEPLOYMENT"
          echo "==============================================="

          if ! grep -q 'IMAGE_PLACEHOLDER' "$FILE"; then

            echo "ERRO: IMAGE_PLACEHOLDER não encontrado."

            echo ""
            echo "Arquivo atual:"
            cat "$FILE"

            exit 1
          fi

          echo "IMAGE_PLACEHOLDER encontrado."

          echo ""
          echo "Imagem:"
          echo "${IMAGE_NAME}"

          sed -i \
            "s|IMAGE_PLACEHOLDER|${IMAGE_NAME}|g" \
            "$FILE"

          echo ""
          echo "==============================================="
          echo "DEPLOYMENT RENDERIZADO"
          echo "==============================================="

          grep -n 'image:' "$FILE"

          echo ""
          echo "Validando imagem..."

          if grep -q 'IMAGE_PLACEHOLDER' "$FILE"; then
            echo "ERRO: placeholder ainda existe."
            exit 1
          fi

          if ! grep -q "${IMAGE_NAME}" "$FILE"; then
            echo "ERRO: imagem esperada não encontrada."
            exit 1
          fi

          echo ""
          echo "Renderização OK."


      # -----------------------------------------------------------------------
      # Validar YAML
      # -----------------------------------------------------------------------

      - name: Validar YAML
        shell: bash
        run: |
          set -euo pipefail

          ruby -e '
            require "yaml"

            files = Dir["k8s/rolling/*.yaml"].sort

            abort "Nenhum manifest encontrado." if files.empty?

            files.each do |file|
              puts "Validando #{file}"

              begin
                YAML.load_stream(File.read(file))
              rescue Psych::Exception => e
                warn "ERRO YAML: #{file}"
                warn e.message
                exit 1
              end
            end

            puts "Todos os manifests YAML estão válidos."
          '


      # -----------------------------------------------------------------------
      # Preparar diretório remoto
      # -----------------------------------------------------------------------

      - name: Preparar diretório remoto
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'mkdir -p /home/ec2-user/rolling'


      # -----------------------------------------------------------------------
      # Copiar manifests
      # -----------------------------------------------------------------------

      - name: Copiar manifests
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            k8s/rolling/*.yaml \
            "${EC2_USER}@${EC2_HOST}:/home/ec2-user/rolling/"


      # -----------------------------------------------------------------------
      # Validar K3s
      # -----------------------------------------------------------------------

      - name: Validar K3s
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl get nodes -o wide'


      # -----------------------------------------------------------------------
      # Namespace
      # -----------------------------------------------------------------------

      - name: Garantir namespace
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl get namespace rolling >/dev/null 2>&1 ||
             sudo /usr/local/bin/kubectl create namespace rolling'


      # -----------------------------------------------------------------------
      # GHCR Secret
      # -----------------------------------------------------------------------

      - name: Criar imagePullSecret
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl -n rolling create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='${{ github.actor }}' \
              --docker-password='${{ secrets.GITHUB_TOKEN }}' \
              --dry-run=client \
              -o yaml | sudo /usr/local/bin/kubectl apply -f -"


      # -----------------------------------------------------------------------
      # Dry Run Kubernetes
      # -----------------------------------------------------------------------

      - name: Validar manifests no Kubernetes
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl apply \
              --dry-run=server \
              -f /home/ec2-user/rolling/'


      # -----------------------------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------------------------

      - name: Aplicar PostgreSQL
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'set -e

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/postgres-secret.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/postgres-service.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/postgres-statefulset.yaml

             sudo /usr/local/bin/kubectl -n rolling \
               rollout status statefulset/postgres \
               --timeout=180s'


      # -----------------------------------------------------------------------
      # RBAC
      # -----------------------------------------------------------------------

      - name: Aplicar RBAC
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/rbac.yaml'


      # -----------------------------------------------------------------------
      # Deployment
      # -----------------------------------------------------------------------

      - name: Aplicar Deployment
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/deployment.yaml'


      # -----------------------------------------------------------------------
      # Service
      # -----------------------------------------------------------------------

      - name: Aplicar Service
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/service.yaml'


      # -----------------------------------------------------------------------
      # Ingress
      # -----------------------------------------------------------------------

      - name: Aplicar Ingress
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/ingress.yaml'


      # -----------------------------------------------------------------------
      # Rollout
      # -----------------------------------------------------------------------

      - name: Aguardar Rolling Update
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'sudo /usr/local/bin/kubectl -n rolling \
              rollout status deployment/app-go \
              --timeout=180s'


      # -----------------------------------------------------------------------
      # Diagnóstico em caso de erro
      # -----------------------------------------------------------------------

      - name: Diagnóstico
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            'set +e

             echo "================================================="
             echo "NODES"
             echo "================================================="

             sudo /usr/local/bin/kubectl get nodes -o wide


             echo "================================================="
             echo "PODS"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get pods -o wide


             echo "================================================="
             echo "DEPLOYMENT"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get deployment app-go -o wide


             echo "================================================="
             echo "REPLICASETS"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get replicasets -o wide


             echo "================================================="
             echo "SERVICE"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get service app-go -o wide


             echo "================================================="
             echo "ENDPOINTS"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get endpoints app-go -o wide


             echo "================================================="
             echo "INGRESS"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get ingress app-go -o yaml


             echo "================================================="
             echo "EVENTS"
             echo "================================================="

             sudo /usr/local/bin/kubectl -n rolling \
               get events \
               --sort-by=.lastTimestamp'


      # -----------------------------------------------------------------------
      # Smoke test
      # -----------------------------------------------------------------------

      - name: Smoke test via rolling.local
        run: |
          set -euo pipefail

          echo "================================================="
          echo "SMOKE TEST"
          echo "================================================="

          echo "IP:   ${EC2_HOST}"
          echo "Host: ${ROLLING_HOST}"
          echo "Path: /healthz"

          echo "================================================="

          for i in $(seq 1 20); do

            code=$(curl \
              -sS \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              -H "Host: ${ROLLING_HOST}" \
              "http://${EC2_HOST}/healthz" \
              || true)

            if [ "$code" = "200" ]; then

              echo ""
              echo "Smoke OK."
              echo "Tentativa: ${i}"

              exit 0
            fi

            echo "tentativa ${i}/20 — HTTP ${code}"

            sleep 5
          done

          echo ""
          echo "================================================="
          echo "SMOKE TEST FALHOU"
          echo "================================================="

          echo "IP:   ${EC2_HOST}"
          echo "Host: ${ROLLING_HOST}"
          echo "Path: /healthz"

          exit 1


      # -----------------------------------------------------------------------
      # Resumo
      # -----------------------------------------------------------------------

      - name: Resumo
        if: success()
        run: |
          {
            echo "### Rolling deploy concluído"
            echo ""
            echo "- Imagem: \`${IMAGE_NAME}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
            echo "- Deployment: \`${APP_NAME}\`"
            echo "- Host: \`${ROLLING_HOST}\`"
            echo "- IP: \`${EC2_HOST}\`"
            echo "- Smoke test: **OK**"
          } >> "$GITHUB_STEP_SUMMARY"
