---
# =============================================================================
# playbook.yml — prepara EC2 para K3s
# =============================================================================
#
# Responsabilidades:
#   1. Instalar K3s Server
#   2. Garantir K3s ativo
#   3. Configurar kubeconfig para ec2-user
#   4. Disponibilizar kubectl para ec2-user
#   5. Criar namespaces da aplicação
#   6. Validar o cluster
#
# O K3s fornece:
#   - containerd
#   - kubectl via k3s kubectl
#   - Traefik
#   - local-path-provisioner
#
# Hosts da aplicação são responsabilidade dos Ingresses:
#   - rolling.local
#   - app-go.local
#   - app-go-azul.local
#   - app-go-verde.local
# =============================================================================

- name: Configurar EC2 para o cluster K3s
  hosts: all
  gather_facts: true
  become: false

  vars:
    k3s_version: "v1.31.5+k3s1"

    namespaces:
      - rolling
      - blue-green

  tasks:

    # =========================================================================
    # 1. K3s
    # =========================================================================

    - name: Verificar se K3s já está instalado
      stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Instalar K3s Server
      become: true
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION={{ k3s_version }} sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Garantir K3s habilitado e rodando
      become: true
      systemd:
        name: k3s
        enabled: true
        state: started

    - name: Aguardar o nó ficar Ready
      become: true
      command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=180s
      changed_when: false

    # =========================================================================
    # 2. Kubeconfig do ec2-user
    # =========================================================================

    - name: Criar diretório .kube
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Copiar kubeconfig do K3s
      become: true
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ec2-user/.kube/config
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: "0600"

    - name: Descobrir IP privado da EC2
      command:
        cmd: hostname -I
      register: hostname_ips
      changed_when: false

    - name: Definir IP privado
      set_fact:
        private_ip: "{{ hostname_ips.stdout.split()[0] }}"

    - name: Configurar endpoint do kubeconfig
      become: true
      replace:
        path: /home/ec2-user/.kube/config
        regexp: 'https://127\.0\.0\.1:6443'
        replace: 'https://{{ private_ip }}:6443'

    # =========================================================================
    # 3. kubectl
    # =========================================================================

    - name: Criar symlink kubectl
      become: true
      file:
        src: /usr/local/bin/k3s
        dest: /usr/local/bin/kubectl
        state: link
        force: true

    - name: Garantir acesso do ec2-user ao kubectl
      command:
        cmd: /usr/local/bin/kubectl version --client
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config
      changed_when: false

    - name: Validar acesso do ec2-user ao cluster
      command:
        cmd: /usr/local/bin/kubectl get nodes -o wide
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config
      become: false
      become_user: ec2-user
      register: nodes_check
      changed_when: false

    # =========================================================================
    # 4. Namespaces
    # =========================================================================

    - name: Criar namespaces da aplicação
      command:
        cmd: /usr/local/bin/kubectl create namespace {{ item }}
      environment:
        KUBECONFIG: /home/ec2-user/.kube/config
      register: namespace_result
      failed_when:
        - namespace_result.rc != 0
        - "'AlreadyExists' not in (namespace_result.stderr | default(''))"
      changed_when: namespace_result.rc == 0
      loop: "{{
