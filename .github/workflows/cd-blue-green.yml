# =============================================================================
# CD - Blue/Green (deploy por cor)
# =============================================================================
# Fluxo:
#   1. Build + push da imagem para o GHCR
#   2. SSH na EC2
#   3. Aplica Postgres do blue-green (Secret + Service + StatefulSet)
#   4. Aplica Services + Ingress (switch + dedicados azul/verde) + RBAC
#   5. Aplica deployment da cor alvo (app-go-blue / app-go-green)
#   6. Smoke test no slot
#
# Ingress aplicados neste workflow:
#   - app-go.local        → Service app-go-active (muda com o switch)
#   - app-go-azul.local   → Service app-go-blue   (fixo no azul)
#   - app-go-verde.local  → Service app-go-green  (fixo no verde)
# =============================================================================
name: CD - Blue/Green (deploy por cor)

on:
  workflow_dispatch:
    inputs:
      color:
        description: "Cor alvo do deploy"
        type: choice
        options: [blue, green]
        required: true

      image_tag:
        description: "Tag da imagem (deixe 'latest' para usar o SHA do commit)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: blue-green-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

jobs:
  # ===========================================================================
  # BUILD + PUSH
  # ===========================================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            printf '%s\n' \
              'module app-go' \
              '' \
              'go 1.25' \
              '' \
              'require github.com/lib/pq v1.10.9' \
              > go.mod
          fi

          go mod tidy

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Resumo do build
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Tag: \`${{ env.IMAGE_TAG }}\`"
            echo "- Imagem: \`${{ env.IMAGE_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # DEPLOY BLUE/GREEN
  # ===========================================================================
  deploy:
    name: Deploy na cor ${{ inputs.color }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # -----------------------------------------------------------------------
      # Renderiza a imagem no deployment da cor selecionada.
      # -----------------------------------------------------------------------
      - name: Renderizar deployment da cor alvo
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" \
            "k8s/blue-green/deployment-${{ inputs.color }}.yaml"

      # -----------------------------------------------------------------------
      # Copia os manifestos para a EC2.
      # -----------------------------------------------------------------------
      - name: Copiar manifestos base e o da cor
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            "mkdir -p ~/blue-green"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            k8s/blue-green/rbac.yaml \
            k8s/blue-green/postgres-secret.yaml \
            k8s/blue-green/postgres-service.yaml \
            k8s/blue-green/postgres-statefulset.yaml \
            k8s/blue-green/service-blue.yaml \
            k8s/blue-green/service-green.yaml \
            k8s/blue-green/service-active.yaml \
            k8s/blue-green/ingress.yaml \
            k8s/blue-green/ingress-blue.yaml \
            k8s/blue-green/ingress-green.yaml \
            "k8s/blue-green/deployment-${{ inputs.color }}.yaml" \
            ec2-user@${{ vars.EC2_PUBLIC_IP }}:/home/ec2-user/blue-green/

      # -----------------------------------------------------------------------
      # GHCR Secret
      # -----------------------------------------------------------------------
      - name: Criar imagePullSecret no namespace blue-green
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            "sudo /usr/local/bin/kubectl -n blue-green create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | \
              sudo /usr/local/bin/kubectl apply -f -"

      # -----------------------------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------------------------
      - name: Aplicar Postgres do blue-green
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/postgres-secret.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/postgres-service.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/postgres-statefulset.yaml && \
             sudo /usr/local/bin/kubectl -n blue-green rollout status \
              statefulset/postgres --timeout=180s'

      # -----------------------------------------------------------------------
      # Services + Ingress + RBAC + Deployment
      # -----------------------------------------------------------------------
      # Aplica:
      #   - RBAC
      #   - Service blue
      #   - Service green
      #   - Service active
      #   - Ingress active
      #   - Ingress blue
      #   - Ingress green
      #   - Deployment da cor selecionada
      #
      # O rollout status aponta para:
      #   app-go-blue
      # ou
      #   app-go-green
      # -----------------------------------------------------------------------
      - name: Aplicar base + deployment da cor
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/rbac.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/service-blue.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/service-green.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/service-active.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/ingress.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/ingress-blue.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/ingress-green.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/blue-green/deployment-${{ inputs.color }}.yaml && \
             sudo /usr/local/bin/kubectl -n blue-green rollout status \
              deploy/app-go-${{ inputs.color }} --timeout=180s'

      # -----------------------------------------------------------------------
      # Smoke test
      # -----------------------------------------------------------------------
      # Executa um pod temporário dentro do namespace blue-green e testa
      # diretamente o Service da cor que acabou de receber o deploy.
      # -----------------------------------------------------------------------
      - name: Smoke test no slot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl -n blue-green run smoke-${{ inputs.color }} \
              --rm -i --restart=Never \
              --image=curlimages/curl -- \
              curl -sf http://app-go-${{ inputs.color }}:5000/healthz'
