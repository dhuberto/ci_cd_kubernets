---
# =============================================================================
# playbook.yml — instala K3s na EC2 e prepara os namespaces
# =============================================================================
# O K3s já traz embutido:
#   - containerd (runtime de container)
#   - kubectl (via `k3s kubectl` ou symlink em /usr/local/bin/kubectl)
#   - Traefik (Ingress Controller padrão)
#   - local-path provisioner (StorageClass padrão)
#
# Não é necessário instalar Docker, kind, kubectl nem ingress-nginx.
# =============================================================================
- name: Configurar EC2 para o cluster K3s
  hosts: all
  gather_facts: true
  become: false

  vars:
    k3s_version: "v1.31.5+k3s1"
    namespaces:
      - rolling
      - blue-green

  tasks:
    # =========================================================================
    # 1) Instalar K3s Server (single-node)
    # =========================================================================
    - name: Verificar se o K3s já está instalado
      stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Instalar K3s Server
      become: true
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION={{ k3s_version }} sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Garantir K3s habilitado e rodando
      become: true
      systemd:
        name: k3s
        enabled: true
        state: started

    - name: Aguardar o nó ficar Ready
      become: true
      shell: |
        k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    # =========================================================================
    # 2) Preparar o kubeconfig para o ec2-user
    # =========================================================================
    - name: Criar diretório .kube do ec2-user
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Copiar kubeconfig do K3s para o ec2-user
      become: true
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ec2-user/.kube/config
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: "0600"

    - name: Descobrir IP privado da EC2
      shell: hostname -I | awk '{print $1}'
      register: private_ip
      changed_when: false

    - name: Substituir 127.0.0.1 pelo IP privado no kubeconfig
      replace:
        path: /home/ec2-user/.kube/config
        regexp: '127\.0\.0\.1'
        replace: "{{ private_ip.stdout }}"

    # =========================================================================
    # 3) Criar symlink do kubectl
    # =========================================================================
    - name: Criar symlink do kubectl
      become: true
      file:
        src: /usr/local/bin/k3s
        dest: /usr/local/bin/kubectl
        state: link
        force: true

    # =========================================================================
    # 4) Criar namespaces do lab
    # =========================================================================
    - name: Criar namespaces do lab
      become: true
      command: k3s kubectl create ns {{ item }}
      register: ns_create
      failed_when: >
        ns_create.rc != 0 and
        'already exists' not in (ns_create.stderr | default(''))
      changed_when: ns_create.rc == 0
      loop: "{{ namespaces }}"

    # =========================================================================
    # 5) Log final
    # =========================================================================
    - name: Mostrar nodes
      become: true
      command: k3s kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Output nodes
      debug:
        msg: "{{ nodes_out.stdout_lines }}"
