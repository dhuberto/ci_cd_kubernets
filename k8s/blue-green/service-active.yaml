# =============================================================================
# service-active.yaml — Service ativo do Blue/Green
# =============================================================================
# O Ingress app-go.local aponta para este Service.
#
# O workflow cd-blue-green-switch.yml altera SOMENTE:
#
#   spec.selector.slot
#
# Valores permitidos:
#
#   blue
#   green
#
# Não há rollout neste Service.
# Não há recriação de Pods durante o switch.
# =============================================================================

apiVersion: v1
kind: Service

metadata:
  name: app-go-active
  namespace: blue-green
  labels:
    app: app-go

spec:
  type: ClusterIP

  selector:
    app: app-go
    slot: blue

  ports:
    - name: http
      port: 5000
      targetPort: 5000
