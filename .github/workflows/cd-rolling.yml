# =============================================================================
# CD - Rolling Update
# =============================================================================
# Fluxo:
#   1. Build + push da imagem para o GHCR
#   2. SSH na EC2
#   3. Renderiza o Deployment com a imagem
#   4. Valida os manifests YAML
#   5. Copia os manifests
#   6. Valida acesso ao K3s
#   7. Cria/atualiza imagePullSecret
#   8. Valida manifests com dry-run
#   9. Aplica PostgreSQL
#  10. Aplica RBAC + Deployment + Service + Ingress
#  11. Aguarda rollout
#  12. Smoke test via rolling.local
#
# Host:
#   rolling.local
#
# Kubernetes:
#   K3s
#
# IMPORTANTE:
#   kubectl é executado com sudo porque o kubeconfig do K3s está em:
#   /etc/rancher/k3s/k3s.yaml
#
# =============================================================================

name: CD - Rolling Update

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem (deixe 'latest' para usar o SHA do commit)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: rolling-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

  EC2_USER: ec2-user
  EC2_HOST: ${{ vars.EC2_PUBLIC_IP }}

  KUBECTL: sudo /usr/local/bin/kubectl

  NAMESPACE: rolling
  APP_NAME: app-go
  ROLLING_HOST: rolling.local

jobs:

  # ===========================================================================
  # BUILD + PUSH
  # ===========================================================================

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: aws

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Login GHCR
      # -----------------------------------------------------------------------

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Buildx
      # -----------------------------------------------------------------------

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Build + Push
      # -----------------------------------------------------------------------

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      # -----------------------------------------------------------------------
      # Resumo
      # -----------------------------------------------------------------------

      - name: Resumo do build
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Tag: \`${{ env.IMAGE_TAG }}\`"
            echo "- Imagem: \`${{ env.IMAGE_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ===========================================================================
  # DEPLOY
  # ===========================================================================

  deploy:
    name: Rolling deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: aws

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Validar configuração
      # -----------------------------------------------------------------------

      - name: Validar configuração da EC2
        run: |
          if [ -z "${EC2_HOST}" ]; then
            echo "ERRO: EC2_PUBLIC_IP não está configurada."
            echo ""
            echo "Configure:"
            echo "Settings → Environments → aws → Variables"
            exit 1
          fi

          echo "EC2: ${EC2_HOST}"
          echo "Host Rolling: ${ROLLING_HOST}"

      # -----------------------------------------------------------------------
      # SSH
      # -----------------------------------------------------------------------

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keygen \
            -y \
            -f ~/.ssh/deploy_key \
            > /dev/null

      # -----------------------------------------------------------------------
      # Renderizar Deployment
      # -----------------------------------------------------------------------

      - name: Renderizar Deployment
        run: |
          set -e

          test -f k8s/rolling/deployment.yaml

          sed -i \
            "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" \
            k8s/rolling/deployment.yaml

          echo "Imagem utilizada:"
          grep -n "image:" k8s/rolling/deployment.yaml

      # -----------------------------------------------------------------------
      # Validar YAML
      # -----------------------------------------------------------------------

      - name: Validar YAML dos manifests
        run: |
          ruby -e '
            require "yaml"

            files = Dir["k8s/rolling/*.yaml"].sort

            if files.empty?
              abort "Nenhum manifest encontrado."
            end

            files.each do |file|
              puts "Validando #{file}"

              begin
                YAML.load_stream(File.read(file))
              rescue Psych::Exception => e
                warn ""
                warn "ERRO DE YAML:"
                warn file
                warn e.message
                exit 1
              end
            end

            puts ""
            puts "Todos os manifests YAML estão válidos."
          '

      # -----------------------------------------------------------------------
      # Testar SSH
      # -----------------------------------------------------------------------

      - name: Testar conexão SSH
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'echo "SSH OK"'

      # -----------------------------------------------------------------------
      # Preparar diretório
      # -----------------------------------------------------------------------

      - name: Preparar diretório na EC2
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'mkdir -p /home/ec2-user/rolling'

      # -----------------------------------------------------------------------
      # Copiar manifests
      # -----------------------------------------------------------------------

      - name: Copiar manifests
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            k8s/rolling/*.yaml \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/rolling/"

      # -----------------------------------------------------------------------
      # Validar K3s
      # -----------------------------------------------------------------------

      - name: Validar acesso ao K3s
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'sudo /usr/local/bin/kubectl get nodes -o wide'

      # -----------------------------------------------------------------------
      # Garantir namespace
      # -----------------------------------------------------------------------

      - name: Garantir namespace rolling
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'sudo /usr/local/bin/kubectl get namespace rolling >/dev/null 2>&1 ||
             sudo /usr/local/bin/kubectl create namespace rolling'

      # -----------------------------------------------------------------------
      # Criar imagePullSecret
      # -----------------------------------------------------------------------

      - name: Criar imagePullSecret
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "sudo /usr/local/bin/kubectl -n rolling create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='${{ github.actor }}' \
              --docker-password='${{ secrets.GITHUB_TOKEN }}' \
              --dry-run=client \
              -o yaml | sudo /usr/local/bin/kubectl apply -f -"

      # -----------------------------------------------------------------------
      # Dry-run
      # -----------------------------------------------------------------------

      - name: Validar manifests no Kubernetes
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'sudo /usr/local/bin/kubectl apply \
              --dry-run=server \
              -f /home/ec2-user/rolling/'

      # -----------------------------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------------------------

      - name: Aplicar PostgreSQL
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'set -e

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/postgres-secret.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/postgres-service.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/postgres-statefulset.yaml

             sudo /usr/local/bin/kubectl -n rolling \
               rollout status statefulset/postgres \
               --timeout=180s'

      # -----------------------------------------------------------------------
      # Aplicação
      # -----------------------------------------------------------------------

      - name: Aplicar app + RBAC
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'set -e

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/rbac.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/deployment.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/service.yaml

             sudo /usr/local/bin/kubectl apply \
               -f /home/ec2-user/rolling/ingress.yaml

             sudo /usr/local/bin/kubectl -n rolling \
               rollout status deployment/app-go \
               --timeout=180s'

      # -----------------------------------------------------------------------
      # Diagnóstico
      # -----------------------------------------------------------------------

      - name: Diagnóstico
        if: failure()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            'set +e

             echo "================================================="
             echo "NODES"
             echo "================================================="
             sudo /usr/local/bin/kubectl get nodes -o wide

             echo "================================================="
             echo "PODS"
             echo "================================================="
             sudo /usr/local/bin/kubectl -n rolling get pods -o wide

             echo "================================================="
             echo "DEPLOYMENT"
             echo "================================================="
             sudo /usr/local/bin/kubectl -n rolling \
               get deployment app-go -o wide

             echo "================================================="
             echo "SERVICE"
             echo "================================================="
             sudo /usr/local/bin/kubectl -n rolling \
               get service app-go -o wide

             echo "================================================="
             echo "ENDPOINTS"
             echo "================================================="
             sudo /usr/local/bin/kubectl -n rolling \
               get endpoints app-go -o wide

             echo "================================================="
             echo "INGRESS"
             echo "================================================="
             sudo /usr/local/bin/kubectl -n rolling \
               get ingress app-go -o yaml

             echo "================================================="
             echo "EVENTS"
             echo "================================================="
             sudo /usr/local/bin/kubectl -n rolling \
               get events \
               --sort-by=.lastTimestamp'

      # -----------------------------------------------------------------------
      # Smoke test
      # -----------------------------------------------------------------------

      - name: Smoke test via rolling.local
        run: |
          echo "================================================="
          echo "SMOKE TEST"
          echo "================================================="
          echo "IP:   ${{ env.EC2_HOST }}"
          echo "Host: ${{ env.ROLLING_HOST }}"
          echo "Path: /healthz"
          echo "================================================="

          for i in $(seq 1 20); do

            code=$(curl \
              -sS \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              -H "Host: ${{ env.ROLLING_HOST }}" \
              "http://${{ env.EC2_HOST }}/healthz" \
              || true)

            if [ "$code" = "200" ]; then
              echo ""
              echo "Smoke OK (tentativa $i)"
              exit 0
            fi

            echo "tentativa $i/20 — HTTP $code"

            sleep 5
          done

          echo ""
          echo "================================================="
          echo "SMOKE TEST FALHOU"
          echo "================================================="
          echo "IP:   ${{ env.EC2_HOST }}"
          echo "Host: ${{ env.ROLLING_HOST }}"
          echo "Path: /healthz"

          exit 1

      # -----------------------------------------------------------------------
      # Resumo
      # -----------------------------------------------------------------------

      - name: Resumo do deploy
        if: success()
        run: |
          {
            echo "### Rolling deploy concluído"
            echo ""
            echo "- Imagem: \`${{ env.IMAGE_NAME }}\`"
            echo "- Namespace: \`${{ env.NAMESPACE }}\`"
            echo "- Deployment: \`${{ env.APP_NAME }}\`"
            echo "- Host: \`${{ env.ROLLING_HOST }}\`"
            echo "- IP: \`${{ env.EC2_HOST }}\`"
            echo "- Smoke test: **OK**"
          } >> "$GITHUB_STEP_SUMMARY"
