# =============================================================================
# ingress.yaml — Ingress do Rolling Update
# =============================================================================
# Host: rolling.local
# Backend: Service app-go do namespace rolling.
# IngressClass: traefik (padrão do K3s).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go
  namespace: rolling
spec:
  ingressClassName: traefik
  rules:
    - host: rolling.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go
                port:
                  number: 5000
