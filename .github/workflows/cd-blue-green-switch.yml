# =============================================================================
# CD - Blue/Green (switch de tráfego)
# =============================================================================
#
# Hosts:
#   rolling.local       → Rolling
#   app-go.local        → tráfego ativo
#   app-go-azul.local   → Blue
#   app-go-verde.local  → Green
#
# O switch altera somente o selector do Service app-go-active.
#
# Fluxo:
#
#   PATCH
#     ↓
#   validar selector
#     ↓
#   validar endpoints
#     ↓
#   validar app-go.local
#
# =============================================================================

name: CD - Blue/Green (switch de tráfego)

on:
  workflow_dispatch:
    inputs:
      color:
        description: "Cor que vai receber o tráfego"
        type: choice
        options:
          - blue
          - green
        required: true

permissions:
  contents: read

concurrency:
  group: blue-green-switch
  cancel-in-progress: false

jobs:

  switch:
    name: Switch para ${{ inputs.color }}
    runs-on: ubuntu-latest
    environment: aws

    steps:

      # -----------------------------------------------------------------------
      # SSH
      # -----------------------------------------------------------------------

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # -----------------------------------------------------------------------
      # CUTOVER
      # -----------------------------------------------------------------------

      - name: Patch do Service
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl \
              -n blue-green \
              patch svc app-go-active \
              -p "{\"spec\":{\"selector\":{\"app\":\"app-go\",\"slot\":\"${{ inputs.color }}\"}}}"'

      # -----------------------------------------------------------------------
      # CONFIRMAR SELECTOR
      # -----------------------------------------------------------------------

      - name: Confirmar selector
        run: |
          selector=$(ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl \
              -n blue-green \
              get svc app-go-active \
              -o jsonpath="{.spec.selector}"')

          echo "Selector atual: $selector"

          expected='{"app":"app-go","slot":"${{ inputs.color }}"}'

          if [ "$selector" != "$expected" ]; then
            echo "Selector incorreto." >&2
            echo "Esperado: $expected" >&2
            echo "Atual:    $selector" >&2
            exit 1
          fi

      # -----------------------------------------------------------------------
      # CONFIRMAR ENDPOINTS
      # -----------------------------------------------------------------------

      - name: Aguardar endpoints do Service ativo
        run: |
          for i in $(seq 1 20); do

            endpoints=$(ssh \
              -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ vars.EC2_PUBLIC_IP }} \
              'sudo /usr/local/bin/kubectl \
                -n blue-green \
                get endpoints app-go-active \
                -o jsonpath="{.subsets[*].addresses[*].ip}"
