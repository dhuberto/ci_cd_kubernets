# =============================================================================
# ingress-blue.yaml — acesso direto ao slot BLUE
# =============================================================================
# Host:
#   app-go-azul.local
#
# Este host NÃO passa pelo app-go-active.
# Ele serve para validar o Blue independentemente do tráfego ativo.
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: app-go-blue
  namespace: blue-green

spec:
  ingressClassName: traefik

  rules:
    - host: app-go-azul.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: app-go-blue
                port:
                  number: 5000
