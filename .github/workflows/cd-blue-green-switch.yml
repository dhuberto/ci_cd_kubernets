# =============================================================================
# CD - Blue/Green (switch de tráfego)
# =============================================================================
# Faz o cutover alterando somente o selector do Service app-go-active.
# Hosts: rolling.local | app-go.local | app-go-azul.local | app-go-verde.local
# =============================================================================

name: CD - Blue/Green (switch de tráfego)

on:
  workflow_dispatch:
    inputs:
      color:
        description: "Cor que vai receber o tráfego"
        type: choice
        options:
          - blue
          - green
        required: true

permissions:
  contents: read

concurrency:
  group: blue-green-switch
  cancel-in-progress: false

env:
  EC2_USER: ec2-user
  EC2_HOST: ${{ vars.EC2_PUBLIC_IP }}
  NAMESPACE: blue-green
  ACTIVE_SERVICE: app-go-active
  ACTIVE_HOST: app-go.local

jobs:

  switch:

    name: Switch para ${{ inputs.color }}

    runs-on: ubuntu-latest

    environment: aws

    steps:

      # SSH
      - name: Configurar chave SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.EC2_SSH_KEY }}' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keygen \
            -y \
            -f ~/.ssh/deploy_key \
            > /dev/null

          echo "Chave SSH válida."

      # Conectividade
      - name: Testar SSH
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${EC2_USER}@${EC2_HOST}" \
            'echo "SSH OK"'

      # Estado atual
      - name: Verificar estado atual
        shell: bash
        run: |
          set -euo pipefail

          echo "Service ativo antes do switch:"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              get svc ${ACTIVE_SERVICE} \
              -o jsonpath='{.spec.selector}'"

          echo ""

      # CUTOVER
      - name: Executar switch
        shell: bash
        run: |
          set -euo pipefail

          COLOR="${{ inputs.color }}"

          echo "Alterando tráfego para: ${COLOR}"

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              patch svc ${ACTIVE_SERVICE} \
              --type=merge \
              -p '{\"spec\":{\"selector\":{\"app\":\"app-go\",\"slot\":\"${COLOR}\"}}}'"

          echo ""
          echo "Switch aplicado."

      # Confirma selector
      - name: Confirmar selector
        shell: bash
        run: |
          set -euo pipefail

          COLOR="${{ inputs.color }}"

          selector=$(ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              get svc ${ACTIVE_SERVICE} \
              -o jsonpath='{.spec.selector}'")

          echo "Selector atual:"
          echo "${selector}"

          expected="{\"app\":\"app-go\",\"slot\":\"${COLOR}\"}"

          echo ""
          echo "Selector esperado:"
          echo "${expected}"

          if [ "${selector}" != "${expected}" ]; then
            echo ""
            echo "ERRO: selector incorreto."
            echo "Esperado: ${expected}"
            echo "Atual:    ${selector}"
            exit 1
          fi

          echo ""
          echo "Selector confirmado."
          echo "Tráfego direcionado para: ${COLOR}"

      # Endpoints
      - name: Aguardar endpoints da cor
        shell: bash
        run: |
          set -euo pipefail

          echo "Aguardando endpoints do Service ${ACTIVE_SERVICE}..."

          for i in $(seq 1 20); do

            endpoints=$(ssh \
              -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${EC2_USER}@${EC2_HOST}" \
              "sudo /usr/local/bin/kubectl \
                -n ${NAMESPACE} \
                get endpoints ${ACTIVE_SERVICE} \
                -o jsonpath='{.subsets[*].addresses[*].ip}'" \
              || true)

            if [ -n "${endpoints}" ]; then
              echo ""
              echo "Endpoints encontrados:"
              echo "${endpoints}"
              exit 0
            fi

            echo "tentativa ${i}/20 — nenhum endpoint"

            sleep 3
          done

          echo ""
          echo "ERRO: ${ACTIVE_SERVICE} não possui endpoints."
          exit 1

      # Diagnóstico
      - name: Diagnóstico
        if: failure()
        shell: bash
        run: |
          set +e

          echo "================================================="
          echo "PODS"
          echo "================================================="

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              get pods -o wide"

          echo "================================================="
          echo "SERVICE"
          echo "================================================="

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              get svc ${ACTIVE_SERVICE} -o yaml"

          echo "================================================="
          echo "ENDPOINTS"
          echo "================================================="

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              get endpoints ${ACTIVE_SERVICE} -o yaml"

          echo "================================================="
          echo "INGRESS"
          echo "================================================="

          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo /usr/local/bin/kubectl \
              -n ${NAMESPACE} \
              get ingress -o wide"

      # Smoke test
      - name: Smoke test via app-go.local
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================="
          echo "SMOKE TEST BLUE/GREEN"
          echo "================================================="
          echo "IP:   ${EC2_HOST}"
          echo "Host: ${ACTIVE_HOST}"
          echo "Path: /healthz"
          echo "Cor:  ${{ inputs.color }}"
          echo "================================================="

          for i in $(seq 1 20); do

            code=$(curl \
              -sS \
              -o /dev/null \
              -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              -H "Host: ${ACTIVE_HOST}" \
              "http://${EC2_HOST}/healthz" \
              || true)

            if [ "${code}" = "200" ]; then

              echo ""
              echo "Smoke OK."
              echo "Tentativa: ${i}"
              echo "HTTP: ${code}"

              exit 0
            fi

            echo "tentativa ${i}/20 — HTTP ${code}"

            sleep 3
          done

          echo ""
          echo "================================================="
          echo "SMOKE TEST FALHOU"
          echo "================================================="
          echo "Switch aplicado, mas o Ingress não retornou HTTP 200."

          exit 1

      # Resumo
      - name: Resumo
        if: success()
        shell: bash
        run: |
          {
            echo "### Blue/Green switch concluído"
            echo ""
            echo "- Cor ativa: \`${{ inputs.color }}\`"
            echo "- Service: \`${ACTIVE_SERVICE}\`"
            echo "- Selector: \`slot=${{ inputs.color }}\`"
            echo "- Host ativo: \`${ACTIVE_HOST}\`"
            echo "- IP: \`${EC2_HOST}\`"
            echo "- Smoke test: **OK**"
            echo ""
            echo "### Hosts"
            echo ""
            echo "- Rolling: \`rolling.local\`"
            echo "- Blue/Green ativo: \`app-go.local\`"
            echo "- Blue: \`app-go-azul.local\`"
            echo "- Green: \`app-go-verde.local\`"
            echo ""
            echo "Rollback: execute novamente escolhendo a cor contrária."
          } >> "$GITHUB_STEP_SUMMARY"
