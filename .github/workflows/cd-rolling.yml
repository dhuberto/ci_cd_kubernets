# =============================================================================
# CD - Rolling Update
# =============================================================================
# Fluxo:
#   1. Build + push da imagem para o GHCR (gera go.sum antes)
#   2. SSH na EC2
#   3. Aplica Postgres (Secret + Service + StatefulSet)
#   4. Aplica app (RBAC + Deployment + Service + Ingress)
#   5. Smoke test via Ingress
# =============================================================================
name: CD - Rolling Update

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem (deixe 'latest' para usar o SHA do commit)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: rolling-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # Gera go.sum antes do build (usa printf para não sofrer com
      # indentação do YAML).
      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            printf '%s\n' \
              'module app-go' \
              '' \
              'go 1.25' \
              '' \
              'require github.com/lib/pq v1.10.9' \
              > go.mod
          fi

          go mod tidy

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Resumo do build
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Tag: \`${{ env.IMAGE_TAG }}\`"
            echo "- Imagem: \`${{ env.IMAGE_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Rolling deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Renderizar manifesto com a imagem
        run: |
          sed -i \
            "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" \
            k8s/rolling/deployment.yaml

      - name: Copiar manifestos
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            "mkdir -p ~/rolling"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            k8s/rolling/*.yaml \
            ec2-user@${{ vars.EC2_PUBLIC_IP }}:/home/ec2-user/rolling/

      # -----------------------------------------------------------------------
      # GHCR Secret
      # -----------------------------------------------------------------------
      - name: Criar imagePullSecret no namespace rolling
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            "sudo /usr/local/bin/kubectl -n rolling create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --dry-run=client -o yaml | \
              sudo /usr/local/bin/kubectl apply -f -"

      # -----------------------------------------------------------------------
      # PostgreSQL
      # -----------------------------------------------------------------------
      - name: Aplicar Postgres
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/postgres-secret.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/postgres-service.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/postgres-statefulset.yaml && \
             sudo /usr/local/bin/kubectl -n rolling rollout status \
              statefulset/postgres --timeout=180s'

      # -----------------------------------------------------------------------
      # Aplicação
      # -----------------------------------------------------------------------
      # Aplica RBAC + Deployments + Services + Ingress.
      # O rollout status aponta para o Deployment `app-go`.
      - name: Aplicar app + RBAC
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            'sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/rbac.yaml && \
             sudo /usr/local/bin/kubectl apply \
              -f /home/ec2-user/rolling/ && \
             sudo /usr/local/bin/kubectl -n rolling rollout status \
              deploy/app-go --timeout=180s'

      # -----------------------------------------------------------------------
      # Smoke test
      # -----------------------------------------------------------------------
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Host: rolling.local" \
              "http://${{ vars.EC2_PUBLIC_IP }}/healthz" || true)

            if [ "$code" = "200" ]; then
              echo "Smoke OK (tentativa $i)"
              exit 0
            fi

            echo "tentativa $i — code=$code"
            sleep 5
          done

          echo "Smoke test falhou" >&2
          exit 1
