# =============================================================================
# ingress.yaml — Ingress do Blue/Green (cor ativa)
# =============================================================================
# Host: app-go.local
# Backend: Service app-go-active (selector trocável pelo switch).
# IngressClass: traefik (padrão do K3s).
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go
  namespace: blue-green
spec:
  ingressClassName: traefik
  rules:
    - host: app-go.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-active
                port:
                  number: 5000
