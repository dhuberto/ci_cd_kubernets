# =============================================================================
# deployment-green.yaml — slot GREEN
# =============================================================================
# Labels:
#   app=app-go
#   slot=green
#
# Essas labels são utilizadas pelos Services:
#   app-go-green
#   app-go-active
# =============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-go-green
  namespace: blue-green
  labels:
    app: app-go
    slot: green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-go
      slot: green

  template:
    metadata:
      labels:
        app: app-go
        slot: green

    spec:
      serviceAccountName: app-go-sa

      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5000

          env:
            - name: APP_NAME
              value: "APP-GO Green"

            - name: APP_COLOR
              value: "green"

            - name: APP_PORT
              value: "5000"

            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB

          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
